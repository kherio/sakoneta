; Equivalente a las reglas de .htaccess pero para instalaciones con
; PHP-FPM, que no lee php_value de .htaccess. Colócalo en la raíz del
; sitio (ya lo está). Puede tardar unos minutos en aplicarse
; (user_ini.cache_ttl) o requerir recargar PHP-FPM:
;   sudo systemctl reload php8.2-fpm   (ajusta la versión de PHP)
upload_max_filesize = 20M
post_max_size = 60M
